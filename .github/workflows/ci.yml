name: CI/CD & Multi-Platform Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Unit & Integration Tests
        run: go test -v -race ./...

      - name: Run Go Vet
        run: go vet ./...

  build:
    name: Build Multi-Architecture Binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Matrix
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u +%Y-%m-%d)
          LDFLAGS="-s -w -X 'github.com/devsync/dev-sync/internal/cli.Version=${VERSION}' -X 'github.com/devsync/dev-sync/internal/cli.Commit=${COMMIT}' -X 'github.com/devsync/dev-sync/internal/cli.BuildDate=${BUILD_DATE}'"

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/dev-sync-linux-amd64 ./cmd/dev-sync
          tar -czf dist/dev-sync-linux-amd64.tar.gz -C dist dev-sync-linux-amd64

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/dev-sync-linux-arm64 ./cmd/dev-sync
          tar -czf dist/dev-sync-linux-arm64.tar.gz -C dist dev-sync-linux-arm64

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/dev-sync-windows-amd64.exe ./cmd/dev-sync
          zip -j dist/dev-sync-windows-amd64.zip dist/dev-sync-windows-amd64.exe

          # Windows arm64
          GOOS=windows GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/dev-sync-windows-arm64.exe ./cmd/dev-sync
          zip -j dist/dev-sync-windows-arm64.zip dist/dev-sync-windows-arm64.exe

          # Compute SHA-256 Checksums
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
